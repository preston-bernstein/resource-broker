# Central Vale config: used when a repo has no .vale.ini of its own, so no repo needs a copy of the styles.
# StylesPath is relative to this file. A repo's own .vale.ini wins over this one.
StylesPath = styles
MinAlertLevel = warning
IgnoredScopes = code, tt

[*.md]
BasedOnStyles = House, HouseDocs, Google, write-good
Google.Latin = warning

[*.{py,js,jsx,ts,tsx,go,java,rs,rb,c,h,cc,cpp,css,swift}]
BasedOnStyles = House, HouseNotes
