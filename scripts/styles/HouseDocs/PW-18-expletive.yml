extends: "script"
message: "Expletive construction ('there is', 'it is important') over 2 per 1000 words. These delay the subject and add words without adding information. Preston's corpus runs 0.1 per 1000, maximum 1.45."
level: "warning"
scope: "raw"
script: |
  text := import("text")
  matches := []
  strip := func(s) {
    s = text.re_replace(`(?s)\A---\r?\n.*?\r?\n---\r?\n`, s, "")
    s = text.re_replace(`(?s)\x60\x60\x60.*?\x60\x60\x60`, s, " ")
    s = text.re_replace(`(?s)~~~.*?~~~`, s, " ")
    s = text.re_replace(`\x60[^\x60\n]*\x60`, s, " ")
    s = text.re_replace(`(?s)<!--.*?-->`, s, " ")
    s = text.re_replace(`(?m)^\s*\|.*$`, s, " ")
    s = text.re_replace(`(?m)^\s*>.*$`, s, " ")
    s = text.re_replace(`\]\([^)]*\)`, s, "]")
    return s
  }
  body := strip(scope)
  words := text.re_find(`\w+`, body, -1)
  report := func(snippet) {
    b := text.index(scope, snippet)
    if b < 0 {
      b = 0
    }
    return {begin: b, end: b + len(snippet)}
  }
  found := text.re_find(`(?i)\b(?:there\s+(?:is|are|was|were)\b|it\s+(?:is|was)\s+(?:worth|clear|important|possible|likely|true|obvious|necessary|notable)\b)`, body, -1)
  if found != undefined && words != undefined && len(words) >= 0 {
    if len(found) > 2 && len(found) * 1000 > 2 * len(words) {
      matches = append(matches, report(found[0][0].text))
    }
  }
